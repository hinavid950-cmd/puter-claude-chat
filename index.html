<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Claude AI Chat • Puter.js</title>
  <meta name="description" content="Advanced AI chat interface powered by Puter.js and Anthropic Claude" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <span class="logo-text">Claude Chat</span>
        </div>
        <button class="btn-icon" id="btn-new-chat" title="New chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section">
        <label class="section-label">Model</label>
        <select id="model-select" class="model-select">
          <option value="anthropic/claude-opus-4-5">Claude Opus 4.5</option>
          <option value="anthropic/claude-sonnet-4-5">Claude Sonnet 4.5</option>
          <option value="anthropic/claude-3-7-sonnet">Claude 3.7 Sonnet</option>
          <option value="anthropic/claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
          <option value="anthropic/claude-3-opus-20240229">Claude 3 Opus</option>
          <option value="anthropic/claude-3-haiku-20240307">Claude 3 Haiku</option>
        </select>
      </div>

      <div class="chat-history" id="chat-history">
        <!-- Saved chats appear here -->
      </div>

      <div class="sidebar-footer">
        <button class="btn-text" id="btn-clear-all">Clear all chats</button>
        <button class="btn-text" id="btn-theme" title="Toggle theme">
          <span id="theme-icon">🌙</span> Theme
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main">
      <header class="chat-header">
        <button class="btn-icon mobile-only" id="btn-menu" title="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
        <div class="header-title">
          <h1 id="chat-title">New Chat</h1>
          <span class="model-badge" id="model-badge">Claude Opus 4.5</span>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="btn-export" title="Export chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h2>How can I help you today?</h2>
          <p>Powered by Puter.js + Anthropic Claude</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain quantum computing in simple terms">
              Explain quantum computing simply
            </button>
            <button class="suggestion" data-prompt="Write a Python function to reverse a linked list">
              Write a Python linked list reverse
            </button>
            <button class="suggestion" data-prompt="What are the key differences between REST and GraphQL?">
              REST vs GraphQL differences
            </button>
            <button class="suggestion" data-prompt="Help me plan a 7-day trip to Japan">
              Plan a 7-day Japan trip
            </button>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="user-input"
            placeholder="Message Claude..."
            rows="1"
            autofocus
          ></textarea>
          <button class="btn-send" id="btn-send" title="Send" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
        <div class="input-footer">
          <span class="hint">Enter to send · Shift+Enter for new line</span>
          <span class="status" id="status"></span>
        </div>
      </div>
    </main>
  </div>

  <!-- Overlay for mobile sidebar -->
  <div class="overlay" id="overlay"></div>

  <script src="https://js.puter.com/v2/"></script>
  <script src="js/app.js"></script>
</body>
</html>
